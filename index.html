    <meta charset="UTF-8">

    <title>Brawler Counter - Live Search</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: white; text-align: center; padding: 20px; }
        
        .search-container { position: sticky; top: 0; background: #0f0f0f; padding: 10px 0; z-index: 100; }
        
        .search-box { 
            padding: 15px; width: 90%; max-width: 500px; font-size: 18px; 
            border-radius: 30px; border: 3px solid #ffcc00; background: #222; color: white;
            outline: none; box-shadow: 0 4px 15px rgba(255, 204, 0, 0.3);
        }

        #gallery { 
            display: grid; grid-template-columns: repeat(3, 1fr); 
            gap: 15px; max-width: 800px; margin: 20px auto; 
        }

        .card { background: #1a1a1a; padding: 10px; border-radius: 15px; border: 2px solid #333; animation: fadeIn 0.3s; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        img { width: 100%; border-radius: 10px; border: 1px solid #444; }
        
        .brawler-label { color: #888; font-size: 12px; margin-bottom: 5px; display: block; }
        
        p { margin-top: 8px; font-size: 14px; color: #ffcc00; font-weight: bold; }
        
        .no-result { color: #555; margin-top: 30px; }
    </style>
</head>
<body>

    <div class="search-container">
        <h2 style="color: #ffcc00;">Brawler Counter Search</h2>
        <input type="text" id="searchBox" class="search-box" placeholder="Am ya Bro type karein..." oninput="searchCounter()" autofocus>
    </div>

        function searchCounter() {
            let input = document.getElementById("searchBox").value.toLowerCase().trim();
            let gallery = document.getElementById("gallery");
            gallery.innerHTML = "";

            if (input.length < 1) return; // Khali hone par kuch mat dikhao

            // Database mein se match hone wale brawlers dhoondo
            for (let brawler in countersData) {
                if (brawler.startsWith(input)) {
                    // Match mil gaya! Ab uske counters dikhao
                    countersData[brawler].forEach(name => {
                        if (name !== "empty") {
                            let div = document.createElement("div");
                            div.className = "card";

                            // Ye batayega ki ye kiska counter hai
                            let label = document.createElement("span");
                            label.className = "brawler-label";
                            label.innerText = "Vs " + brawler.toUpperCase();

                            let img = document.createElement("img");
                            // Aapki file naming: amber_portrait.png
                            let fileName = name.toLowerCase().replace(" ", "") + "_portrait.png";
                            img.src = "./images/" + fileName;

                            let p = document.createElement("p");
                            p.innerText = name;

                            img.onerror = function() {
                                this.src = "https://via.placeholder.com/150?text=" + name;
                            };

                            div.appendChild(label);
                            div.appendChild(img);
                            div.appendChild(p);
                            gallery.appendChild(div);
                        }
                    });
                    
                    // Ek match milne par loop rok sakte hain agar aapko sirf ek brawler ke 3 counters chahiye
                    break; 
                }
            }
        }
